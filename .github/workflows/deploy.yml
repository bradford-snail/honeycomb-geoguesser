name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "admin/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      # Game at the site root, admin tool at /admin/
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          mkdir _site/admin
          cp admin/index.html admin/admin.css _site/admin/
          sed -i 's#\.\./site/#../#g' _site/admin/index.html

      - name: Write config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'window.PINIT_CONFIG = {\n  supabaseUrl: "%s",\n  supabaseKey: "%s"\n};\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > _site/config.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
